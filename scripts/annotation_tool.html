<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VinDr-SpineXR Annotator</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --border: #334155;
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font-family);
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar - Image List */
        #sidebar {
            width: 320px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .sidebar-header h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 4px; }
        .sidebar-header p { font-size: 0.85rem; color: var(--text-muted); }

        #image-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .image-item {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .image-item:hover { background-color: rgba(255,255,255,0.05); }
        .image-item.active { background-color: var(--accent); color: white; font-weight: 500; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #475569; }
        .status-dot.done { background: var(--success); }

        /* Main Workspace */
        #workspace {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
        }

        /* Toolbar */
        #toolbar {
            height: 70px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 20px;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.2);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        label { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;}
        
        select {
            background: transparent;
            color: white;
            border: none;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }
        
        select option { background: var(--bg-panel); }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn:hover { background-color: var(--accent-hover); }
        .btn-success { background-color: var(--success); margin-left: auto;}
        .btn-success:hover { background-color: var(--success-hover); }
        .btn-danger { background-color: var(--danger); padding: 6px 12px; font-size: 0.8rem;}
        .btn-danger:hover { background-color: #dc2626; }

        /* Canvas Area */
        #canvas-container {
            flex-grow: 1;
            overflow: auto;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        canvas {
            background-color: #000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            cursor: crosshair;
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            /* Prevents selection while drawing */
            user-select: none; 
        }

        /* Right Panel - Annotations List */
        #right-panel {
            width: 320px;
            background-color: var(--bg-panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
        }

        #annotations-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .annotation-card {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ann-info strong { color: #10b981; font-size: 1.1rem; }
        .ann-info span { color: var(--text-muted); font-size: 0.85rem; display: block; margin-top: 4px;}
        
        /* Empty State */
        .empty-state {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
            font-size: 0.9rem;
        }
        
    </style>
</head>
<body>

<div id="sidebar">
    <div class="sidebar-header">
        <h2>VinDr Annotator</h2>
        <p>Phase 13 Ground Truth Prototype</p>
    </div>
    <div id="image-list">
        {% for img in images %}
            <div class="image-item" id="item-{{ img }}" onclick="loadImage('{{ img }}')">
                <span>{{ img }}</span>
                <div class="status-dot" id="status-{{ img }}"></div>
            </div>
        {% endfor %}
    </div>
</div>

<div id="workspace">
    <div id="toolbar">
        <div class="tool-group">
            <label>Draw:</label>
            <select id="label-select">
                <option value="L1">L1 Vertebra</option>
                <option value="L2">L2 Vertebra</option>
                <option value="L3">L3 Vertebra</option>
                <option value="L4">L4 Vertebra</option>
                <option value="L5">L5 Vertebra</option>
            </select>
        </div>
        
        <div class="tool-group">
            <label>Visibility:</label>
            <select id="vis-select">
                <option value="visible">Visible</option>
                <option value="partially_visible">Partially Visible</option>
            </select>
        </div>
        
        <button class="btn btn-success" onclick="saveAnnotations()">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            Save Progress
        </button>
    </div>
    
    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>
</div>

<div id="right-panel">
    <div class="panel-header">
        Current Annotations
    </div>
    <div id="annotations-list">
        <div class="empty-state">Select an image to start</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let currentImageId = null;
    let img = new Image();
    
    let isDrawing = false;
    let startX = 0;
    let startY = 0;
    
    let annotations = []; 
    let allAnnotations = []; 
    
    // Scale tracking since CSS scales the canvas
    let scaleX = 1;
    let scaleY = 1;

    // Load existing from server
    fetch('/api/annotations').then(r => r.json()).then(data => {
        allAnnotations = data;
        updateStatusDots();
    });

    function updateStatusDots() {
        allAnnotations.forEach(a => {
            if(a.annotations.length > 0) {
                const dot = document.getElementById('status-' + a.image_id);
                if(dot) dot.classList.add('done');
            }
        });
    }

    function loadImage(imgId) {
        if(currentImageId) {
            document.getElementById('item-' + currentImageId).classList.remove('active');
        }
        currentImageId = imgId;
        document.getElementById('item-' + imgId).classList.add('active');
        
        const existing = allAnnotations.find(a => a.image_id === imgId);
        annotations = existing ? [...existing.annotations] : [];
        renderList();
        
        img.src = '/image/' + imgId;
        img.onload = () => {
            // Actual image dimensions
            canvas.width = img.width;
            canvas.height = img.height;
            redraw();
        };
    }

    function updateScale() {
        const rect = canvas.getBoundingClientRect();
        scaleX = canvas.width / rect.width;
        scaleY = canvas.height / rect.height;
        return rect;
    }

    canvas.addEventListener('mousedown', e => {
        if(!currentImageId) return;
        const rect = updateScale();
        startX = (e.clientX - rect.left) * scaleX;
        startY = (e.clientY - rect.top) * scaleY;
        isDrawing = true;
    });

    canvas.addEventListener('mousemove', e => {
        if (!isDrawing) return;
        const rect = updateScale();
        const mouseX = (e.clientX - rect.left) * scaleX;
        const mouseY = (e.clientY - rect.top) * scaleY;
        
        redraw();
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 2 * scaleX; // Adjust line width based on scale so it looks consistent
        ctx.strokeRect(startX, startY, mouseX - startX, mouseY - startY);
    });

    canvas.addEventListener('mouseup', e => {
        if (!isDrawing) return;
        isDrawing = false;
        const rect = updateScale();
        const endX = (e.clientX - rect.left) * scaleX;
        const endY = (e.clientY - rect.top) * scaleY;
        
        const x_min = Math.min(startX, endX);
        const y_min = Math.min(startY, endY);
        const x_max = Math.max(startX, endX);
        const y_max = Math.max(startY, endY);
        
        // Prevent accidental micro-clicks
        if (x_max - x_min > 10 && y_max - y_min > 10) {
            annotations.push({
                vertebra: document.getElementById('label-select').value,
                bbox: [x_min, y_min, x_max, y_max],
                visibility: document.getElementById('vis-select').value
            });
            renderList();
            redraw();
            
            // Auto-advance label selection if possible
            const select = document.getElementById('label-select');
            if (select.selectedIndex < select.options.length - 1) {
                select.selectedIndex += 1;
            }
        }
    });

    function redraw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (img.src) {
            ctx.drawImage(img, 0, 0);
        }
        
        annotations.forEach(ann => {
            const [x1, y1, x2, y2] = ann.bbox;
            
            // Draw Box
            ctx.strokeStyle = '#10b981'; // Success Green
            ctx.lineWidth = 3;
            ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
            
            // Draw Label Background
            ctx.fillStyle = '#10b981';
            const textWidth = ctx.measureText(ann.vertebra).width + 10;
            ctx.fillRect(x1, y1 - 25, 45, 25);
            
            // Draw Label Text
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText(ann.vertebra, x1 + 5, y1 - 7);
        });
    }

    function renderList() {
        const list = document.getElementById('annotations-list');
        list.innerHTML = '';
        
        if(annotations.length === 0) {
            list.innerHTML = '<div class="empty-state">No annotations yet.</div>';
            return;
        }
        
        // Sort annotations by Y-coordinate for display
        const sortedAnns = [...annotations].sort((a,b) => Math.min(a.bbox[1], a.bbox[3]) - Math.min(b.bbox[1], b.bbox[3]));
        
        sortedAnns.forEach((ann) => {
            // Find original index for deletion
            const originalIdx = annotations.indexOf(ann);
            const div = document.createElement('div');
            div.className = 'annotation-card';
            div.innerHTML = `
                <div class="ann-info">
                    <strong>${ann.vertebra}</strong>
                    <span>${ann.visibility.replace('_', ' ')}</span>
                </div>
                <button class="btn btn-danger" onclick="deleteAnn(${originalIdx})">Remove</button>
            `;
            list.appendChild(div);
        });
    }

    function deleteAnn(idx) {
        annotations.splice(idx, 1);
        renderList();
        redraw();
    }

    function saveAnnotations() {
        if (!currentImageId) {
            alert("Please select an image first.");
            return;
        }
        
        const payload = {
            image_id: currentImageId,
            annotations: annotations
        };
        
        fetch('/api/annotations', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        }).then(r => r.json()).then(data => {
            const btn = document.querySelector('.btn-success');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Saved!';
            btn.style.backgroundColor = '#059669';
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.backgroundColor = '';
            }, 1500);
            
            const idx = allAnnotations.findIndex(a => a.image_id === currentImageId);
            if (idx >= 0) allAnnotations[idx] = payload;
            else allAnnotations.push(payload);
            
            updateStatusDots();
        }).catch(err => alert("Error saving annotations!"));
    }
</script>

</body>
</html>
